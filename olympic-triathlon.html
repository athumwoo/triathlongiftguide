<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Best Olympic Distance Triathlon Gift Guide</title>
    <script src="products.js"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="dd871b80-f5ab-4e41-b2fb-2bd0ea331941"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #111111; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; margin-top: 20px; }
        .header { margin-bottom: 32px; text-align: center; }
        .header h1 { font-size: 24px; font-weight: 800; color: #FF5500; margin-bottom: 4px; }
        .header p { color: #888888; font-size: 14px; line-height: 1.5; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; margin-top: 20px; }
        .product-card { background-color: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: inherit; }
        .product-card:hover { border-color: #444444; }
        .img-placeholder { background-color: #ffffff; padding: 8px; width: 100%; aspect-ratio: 1; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-placeholder img { width: 100%; height: 100%; object-fit: contain; }
        .prod-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .prod-desc { font-size: 11px; color: #888888; margin-bottom: 8px; line-height: 1.4; }
        .prod-price { font-size: 13px; font-weight: 700; color: #FF5500; }
        .nav-back { display: inline-block; margin-bottom: 20px; color: #888888; text-decoration: none; font-size: 13px; }
        .nav-back:hover { color: #FF5500; }
        footer { margin-top: 40px; padding: 20px 0; border-top: 1px solid #2d2d2d; text-align: center; font-size: 11px; color: #555; }
        footer a { color: #555; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="nav-back">← Back to Interactive Finder</a>
        <div class="header">
            <h1 id="pageTitle">Olympic Distance Triathlon Gift Guide</h1>
            <p id="pageSubtitle">Vetted essentials and gear bundles optimized perfectly for athletes taking on the standard 51.50km distance tri.</p>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <footer>
            <p>&copy; 2026 Triathlon Gift Guide. All rights reserved.</p>
            <p style="margin-top: 8px;"><a href="legal.html">Legal Notice</a> | <a href="privacy.html">Privacy Policy</a></p>
        </footer>
    </div>
    <script>
        // CHANGE THIS SETTING DEPENDING ON THE PAGE LOGIC REQUIRED:
        // Options: 'distance-olympic', 'experience-beginner'
        const pageMode = 'distance-olympic'; 

        function renderPage() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            const filtered = database.filter(item => {
                if (pageMode === 'distance-sprint') return item.dist.includes('sprint');
                if (pageMode === 'distance-olympic') return item.dist.includes('olympic');
                if (pageMode === 'experience-beginner') return item.exp === 'beginner' || item.exp === 'both';
                return true;
            });

            filtered.forEach(item => {
                grid.innerHTML += `
                    <a href="${item.url}" target="_blank" class="product-card">
                        <div>
                            <div class="img-placeholder"><img src="${item.img}" alt="${item.name}"></div>
                            <div class="prod-title">${item.name}</div>
                            <div class="prod-desc">${item.desc}</div>
                        </div>
                        <div class="prod-price" style="margin-top: 8px;">${item.price}</div>
                    </a>
                `;
            });
        }
        renderPage();
    </script>
</body>
</html>
